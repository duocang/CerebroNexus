<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc">
  <title id="title">Linked Views data flow</title><desc id="desc">A Cerebro data object is converted into a browser bundle that renders linked expression, spatial, Trekker and clone panels. A shared selection flows back to every panel.</desc>
  <style>text{font-family:Arial,sans-serif;fill:#263238}.h{font-size:22px;font-weight:700}.s{font-size:15px}.b{stroke:#d97120;stroke-width:2;rx:14}.a{stroke:#d97120;stroke-width:3;fill:none;marker-end:url(#arrow)}.p{fill:#fff7f0}.q{fill:#f6fbff}.r{fill:#f4fbf6}</style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d97120"/></marker></defs>
  <rect x="35" y="120" width="220" height="165" class="b p"/><text x="58" y="158" class="h">Cerebro object</text><text x="58" y="192" class="s">expression + metadata</text><text x="58" y="218" class="s">embeddings + spatial/FOVs</text><text x="58" y="244" class="s">Trekker + TCR clones</text>
  <path d="M255 202 H390" class="a"/>
  <rect x="390" y="120" width="250" height="165" class="b q"/><text x="414" y="158" class="h">Viewer bundle</text><text x="414" y="192" class="s">normalised coordinates</text><text x="414" y="218" class="s">colour, image and panel data</text><text x="414" y="244" class="s">one cell identifier per point</text>
  <path d="M640 202 H740" class="a"/>
  <rect x="740" y="55" width="145" height="82" class="b r"/><text x="766" y="91" class="h">UMAP</text><text x="756" y="115" class="s">expression</text>
  <rect x="925" y="55" width="145" height="82" class="b r"/><text x="944" y="91" class="h">Spatial</text><text x="943" y="115" class="s">one panel/FOV</text>
  <rect x="740" y="260" width="145" height="82" class="b r"/><text x="755" y="296" class="h">Trekker</text><text x="758" y="320" class="s">physical map</text>
  <rect x="925" y="260" width="145" height="82" class="b r"/><text x="945" y="296" class="h">TCR</text><text x="946" y="320" class="s">clone layout</text>
  <path d="M810 137 V190 H905 V137 M995 137 V190 H905 M810 260 V215 H905 V260 M995 260 V215 H905" class="a"/>
  <rect x="360" y="355" width="380" height="48" class="b p"/><text x="393" y="386" class="h">Shared selection, hover and filters</text><path d="M905 215 V355 H740" class="a"/>
</svg>
