<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" role="img" aria-labelledby="title desc">
<title id="title">Builder evidence chain</title>
<desc id="desc">Inspect, freeze, build, verify, publish, and recover stages connected by arrows. Independent evidence is recorded below the chain.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#586A7A"/></marker></defs>
<rect width="1000" height="230" fill="white"/>
<rect x="18" y="70" width="124" height="58" rx="9" fill="#F7FBFF" stroke="#24557A" stroke-width="2"/><text x="80" y="105" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#17324D">Inspect</text>
<rect x="186" y="70" width="124" height="58" rx="9" fill="#F7FBFF" stroke="#24557A" stroke-width="2"/><text x="248" y="105" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#17324D">Freeze</text>
<rect x="354" y="70" width="124" height="58" rx="9" fill="#F7FBFF" stroke="#24557A" stroke-width="2"/><text x="416" y="105" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#17324D">Build</text>
<rect x="522" y="70" width="124" height="58" rx="9" fill="#F7FBFF" stroke="#24557A" stroke-width="2"/><text x="584" y="105" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#17324D">Verify</text>
<rect x="690" y="70" width="124" height="58" rx="9" fill="#F7FBFF" stroke="#24557A" stroke-width="2"/><text x="752" y="105" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#17324D">Publish</text>
<rect x="858" y="70" width="124" height="58" rx="9" fill="#F7FBFF" stroke="#24557A" stroke-width="2"/><text x="920" y="105" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#17324D">Recover</text>
<line x1="146" y1="99" x2="178" y2="99" stroke="#586A7A" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="314" y1="99" x2="346" y2="99" stroke="#586A7A" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="482" y1="99" x2="514" y2="99" stroke="#586A7A" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="650" y1="99" x2="682" y2="99" stroke="#586A7A" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="818" y1="99" x2="850" y2="99" stroke="#586A7A" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M80 151 H920" stroke="#BD6B21" stroke-width="3" stroke-dasharray="7 5"/>
<text x="500" y="183" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#6A3B12">plan digest · artifact contents · release journal · managed fingerprints</text>
<text x="500" y="211" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#44515C">Each claim is tied to a recorded boundary, not inferred from the interface.</text>
</svg>
