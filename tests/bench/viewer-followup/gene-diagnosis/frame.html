<!doctype html><meta charset="utf-8"><title>Gene RAF cadence control</title>
<h1>Gene RAF cadence control</h1><p>No Viewer, data, GPU, or ready logic. 20 consecutive RAF callbacks per capture.</p>
<button id="start">Capture RAF</button><button id="paint">Capture with canvas paint</button>
<canvas id="canvas" width="200" height="100"></canvas><pre id="results"></pre>
<script>
const results=[];const pre=document.querySelector('#results');
function run(paint){const row={paint,start:performance.now(),visibility:document.visibilityState,focus:document.hasFocus(),frames:[]};results.push(row);let last=row.start;
 function frame(t){const now=performance.now();row.frames.push({at:now,delta:now-last,t,visibility:document.visibilityState,focus:document.hasFocus()});last=now;
 if(paint){const ctx=document.querySelector('canvas').getContext('2d');ctx.fillStyle=row.frames.length%2?'red':'blue';ctx.fillRect(0,0,200,100);}
 pre.textContent=JSON.stringify(results);if(row.frames.length<20)requestAnimationFrame(frame);else row.end=performance.now();}
 requestAnimationFrame(frame);
}
document.querySelector('#start').onclick=()=>run(false);document.querySelector('#paint').onclick=()=>run(true);
</script>
