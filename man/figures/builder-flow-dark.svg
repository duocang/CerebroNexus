<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" role="img" aria-labelledby="flow-title flow-desc">
<title id="flow-title">Two routes from a Seurat object to a Cerebro app</title>
<desc id="flow-desc">Both routes start from Seurat objects and end at a runnable Shiny app. launchCerebroBuilder() does it in one interactive step. convertSeuratToCerebro() writes a .crb, which createShinyApp() then bundles.</desc>
<rect x="16" y="133" width="156" height="64" rx="10" fill="#2a2a2e" stroke="#3c3c42" stroke-width="1.5"/>
<text x="94" y="160" fill="#e8e8ea" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="middle">Seurat object(s)</text>
<text x="94" y="180" fill="#7c7c84" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" font-weight="400" text-anchor="middle">.rds · .qs2 · .qs</text>
<path d="M172 165 C210 165 210 87 241 87" stroke="#fb923c" stroke-width="1.5" fill="none"/><path d="M248 87 l-7 -4.2 v8.4 Z" fill="#fb923c"/>
<text x="248" y="38" fill="#fb923c" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1.4">ONE INTERACTIVE STEP</text>
<rect x="248" y="53" width="520" height="68" rx="10" fill="#33210f" stroke="#fb923c" stroke-width="1.5"/>
<text x="508" y="82" fill="#e8e8ea" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="16" font-weight="600" text-anchor="middle">launchCerebroBuilder()</text>
<text x="508" y="103" fill="#a6a6ac" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" text-anchor="middle">reads the object first · preview before writing · several at once</text>
<path d="M172 165 C210 165 210 243 241 243" stroke="#6ba3f0" stroke-width="1.5" fill="none"/><path d="M248 243 l-7 -4.2 v8.4 Z" fill="#6ba3f0"/>
<text x="248" y="194" fill="#6ba3f0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1.4">TWO CALLS</text>
<rect x="248" y="209" width="214" height="68" rx="10" fill="#16233a" stroke="#6ba3f0" stroke-width="1.5"/>
<text x="355" y="240" fill="#e8e8ea" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12.5" font-weight="600" text-anchor="middle">convertSeuratToCerebro()</text>
<text x="355" y="259" fill="#a6a6ac" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" text-anchor="middle">arguments by hand</text>
<path d="M462 243 H479" stroke="#6ba3f0" stroke-width="1.5" fill="none"/><path d="M486 243 l-7 -4.2 v8.4 Z" fill="#6ba3f0"/>
<rect x="486" y="227" width="72" height="32" rx="6" fill="#212124" stroke="#3c3c42" stroke-width="1.5"/>
<text x="522" y="247" fill="#e8e8ea" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" font-weight="600" text-anchor="middle">.crb</text>
<path d="M558 243 H575" stroke="#6ba3f0" stroke-width="1.5" fill="none"/><path d="M582 243 l-7 -4.2 v8.4 Z" fill="#6ba3f0"/>
<rect x="582" y="209" width="186" height="68" rx="10" fill="#16233a" stroke="#6ba3f0" stroke-width="1.5"/>
<text x="675" y="240" fill="#e8e8ea" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" font-weight="600" text-anchor="middle">createShinyApp()</text>
<text x="675" y="259" fill="#a6a6ac" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" text-anchor="middle">bundle it</text>
<path d="M768 87 C798 87 798 165 821 165" stroke="#fb923c" stroke-width="1.5" fill="none"/><path d="M828 165 l-7 -4.2 v8.4 Z" fill="#fb923c"/>
<path d="M768 243 C798 243 798 165 821 165" stroke="#6ba3f0" stroke-width="1.5" fill="none"/><path d="M828 165 l-7 -4.2 v8.4 Z" fill="#6ba3f0"/>
<rect x="828" y="133" width="156" height="64" rx="10" fill="#2a2a2e" stroke="#3c3c42" stroke-width="1.5"/>
<text x="906" y="160" fill="#e8e8ea" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="middle">Runnable app</text>
<text x="906" y="180" fill="#7c7c84" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" text-anchor="middle">every sample, one link</text>
</svg>
